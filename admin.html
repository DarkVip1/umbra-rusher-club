
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URC Admin</title>
<style>
body{margin:0;background:#080b12;color:#fff;font:16px Arial;padding:20px}
main{max-width:650px;margin:auto}
section{background:#121a27;padding:18px;border-radius:12px;margin:18px 0}
input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:8px}
input,textarea{background:#080b12;color:white;border:1px solid #354158}
button{background:#dcecff;border:0;font-weight:bold}
article{border:1px solid #354158;padding:12px;margin:10px 0;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>URC / ADMIN</h1>
<p>Berita tersimpan di database bersama.</p>
<section>
<h2>Tambah berita</h2>
<input id="title" placeholder="Judul berita">
<textarea id="body" placeholder="Isi berita"></textarea>
<button id="add">Publikasikan berita</button>
<p id="status"></p>
</section>
<section>
<h2>Daftar berita</h2>
<div id="list">Memuat berita...</div>
</section>
</main>
<script type="module">
import {createClient} from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const db=createClient(
  'https://yzpzylbjowcxrimdxypb.supabase.co/rest/v1/',
  'sb_publishable_air6Cb3zpPgckbPIH4IhEQ_CTlwIh24'
);
const $=id=>document.getElementById(id);
const safe=s=>String(s).replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

async function load(){
  const {data,error}=await db.from('urc_news')
    .select('id,title,body,created_at')
    .order('created_at',{ascending:false});
  if(error){$('list').textContent='Gagal memuat: '+error.message;return}
  $('list').innerHTML=data.map(n=>`
    <article><b>${safe(n.title)}</b><p>${safe(n.body)}</p>
    <button data-id="${n.id}">Hapus</button></article>
  `).join('')||'Belum ada berita.';
}

$('add').onclick=async()=>{
  const title=$('title').value.trim();
  const body=$('body').value.trim();
  if(!title||!body){$('status').textContent='Isi judul dan berita dulu.';return}
  $('add').disabled=true;
  const {error}=await db.from('urc_news').insert([{title,body}]);
  $('add').disabled=false;
  $('status').textContent=error?'Gagal: '+error.message:'Berita tersimpan!';
  if(!error){$('title').value='';$('body').value='';await load()}
};

$('list').onclick=async e=>{
  const id=e.target.dataset.id;
  if(!id)return;
  if(!confirm('Hapus berita ini?'))return;
  const {error}=await db.from('urc_news').delete().eq('id',id);
  if(error)alert('Gagal menghapus: '+error.message);
  else await load();
};
load();
</script>
</body>
</html>
